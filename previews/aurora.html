<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050d17">
<title>SolarRT · Aurora entrance preview</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;color:#e9fff7;background:#050d17}
body{margin:0}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.layer{position:relative;min-height:100vh;min-height:100svh}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(20px,5vw,84px)}
.logo{display:inline-block;width:40px;height:40px;flex:none;filter:drop-shadow(0 0 9px #6cf9be32)}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;letter-spacing:-1px;font-weight:600}
.mark{animation:sway 4s ease-in-out infinite alternate;transform-origin:center}
.echo{animation:sway 3s ease-in-out infinite alternate-reverse;transform-origin:center}
@keyframes sway{from{transform:skewY(-5deg) scaleY(.9);opacity:.75}to{transform:skewY(5deg) scaleY(1.04);opacity:1}}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #98c7bb55;background:#0b1a23da;border-radius:24px;padding:10px 17px}
button:hover,button:focus-visible{background:#23443f;outline-color:#abffce}
#intro{position:fixed;inset:0;z-index:2;display:grid;place-items:center;text-align:center;transition:opacity 1.6s ease-in-out}
#intro[hidden]{display:none}
.lockup{display:grid;justify-items:center;text-shadow:0 2px 35px #031019;background:radial-gradient(ellipse,#05121e99,transparent 72%);padding:2em}
.lockup .logo{width:70px;height:70px}
h1{font-weight:500;letter-spacing:-.08em;font-size:clamp(70px,10vw,158px);line-height:1;margin:12px 0 18px}
.mono{font:11px/1.6 Consolas,monospace;text-transform:uppercase;letter-spacing:.16em;color:#b0d9ce}
.lockup p{margin:0}
footer{position:absolute;bottom:0;width:100%;text-align:left}
#app{display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity 1.6s ease-in-out}
body.entered #intro{opacity:0;pointer-events:none}
body.entered #app{opacity:1}
header{background:linear-gradient(#06111cef,transparent)}
.panel{margin:0 clamp(20px,6vw,96px) clamp(26px,8vh,100px);max-width:590px;background:#081720ed;border:1px solid #90bcac38;border-radius:18px;padding:clamp(20px,4vw,44px)}
h2{font-weight:500;letter-spacing:-.055em;font-size:clamp(37px,5vw,68px);line-height:1.05;margin:.22em 0 .4em}
.panel p{color:#b7cec9;margin:0;line-height:1.5}
@media(prefers-reduced-motion:reduce){.mark,.echo{animation:none}#intro,#app{transition:none}}
</style>
<canvas aria-hidden="true"></canvas>
<main id="app" class="layer" inert>
 <header><div class="brand"><span class="logo"></span>SolarRT</div><button id="replay">Replay entrance</button></header>
 <section class="panel"><span class="mono">Application preview</span><h2>Aurora &amp; Kp monitor</h2><p>This is the landing view for the entrance test. Live observations are available in the main application.</p></section>
</main>
<section id="intro" aria-label="SolarRT introduction">
 <div class="lockup"><span class="logo"></span><h1>SolarRT</h1><p class="mono">Aurora &amp; geomagnetic activity</p></div>
 <footer><span class="mono">Northern lights</span><button id="skip">Skip intro</button></footer>
</section>
<script>
// Reuse the two auroral arcs and the star from SolarRT's existing favicon.
document.querySelectorAll('.logo').forEach((el,i)=>{
 el.innerHTML='<svg aria-hidden="true" viewBox="0 0 64 64"><defs><linearGradient id="r'+i+'"><stop stop-color="#77ffc8"/><stop offset=".52" stop-color="#68dfdb"/><stop offset="1" stop-color="#ae88ff"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="#0b1925"/><g fill="none" stroke-linecap="round"><path class="mark" d="M6 44c10-14 20-22 28-22s16 6 24 14" stroke="url(#r'+i+')" stroke-width="6"/><path class="echo" d="M10 52c9-9 17-14 24-14s13 4 20 9" stroke="#55dfae" stroke-width="3"/></g><circle cx="48" cy="14" r="3" fill="#ffd166"/></svg>';
});
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const intro=document.querySelector('#intro'), app=document.querySelector('#app');
const skip=document.querySelector('#skip'), replay=document.querySelector('#replay');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let width,height,startTimer,endTimer,frame,last=0,time=0;
const glyphs=' .,:;i!|/+=*';
const skyCanvas=document.createElement('canvas');
const beams=[];
function cacheScene(){
 skyCanvas.width=canvas.width;skyCanvas.height=canvas.height;
 const sky=skyCanvas.getContext('2d');
 sky.scale(canvas.width/width,canvas.height/height);
 const gradient=sky.createLinearGradient(0,0,0,height);
 gradient.addColorStop(0,'#040914');gradient.addColorStop(.7,'#0d2634');gradient.addColorStop(1,'#070e19');
 sky.fillStyle=gradient;sky.fillRect(0,0,width,height);
 sky.fillStyle='#adcdd1';sky.font='10px monospace';
 for(let i=1;i<150;i++){
   sky.globalAlpha=.25+.45*(i%5)/4;
   sky.fillText(i%13===0?'+':'.',width*((i*.618034)%1),height*((i*i*.17731)% .85));
 }
 // Rasterize the glyphs once. Move each complete ray at subpixel precision.
 beams.length=0;
 const columns=Math.max(2,Math.min(205,Math.ceil(width/6)));
 for(let layer=2;layer>=0;layer--){
   for(let col=0;col<columns;col++){
     const u=col/(columns-1), phase=u*8.5+layer*1.6;
     const ray=document.createElement('canvas');
     ray.width=20;ray.height=316;
     const ink=ray.getContext('2d');
     ink.font='17px monospace';
     const hue=147+layer*24+36*Math.sin(phase*.65);
     for(let row=0;row<25;row++){
       const v=row/24, power=Math.pow(1-v,1.55);
       ink.globalAlpha=power;
       ink.fillStyle='hsl('+(hue+v*73)+' 89% '+(58+power*24)+'%)';
       ink.fillText(glyphs[1+Math.floor(power*(7+3*Math.cos(col*.48)**2))],2,308-row*12);
     }
     beams.push({ray,u,phase,col,layer});
   }
 }
}
function draw(t){
 if(!ctx)return;
 ctx.drawImage(skyCanvas,0,0,width,height);
 const glyphWidth=Math.max(8,Math.min(14,width/100));
 for(const {ray,u,phase,col,layer} of beams){
   const a=phase+t*.18;
   const fold=Math.sin(a+1.7*Math.sin(a*.66));
   const depth=1.2+layer*.21+.27*fold;
   const x=width*(.5+(u-.5)*2.1/depth);
   const base=height*(.47+.17*Math.sin(a*.74)+.1*fold-layer*.07);
   const beam=.55+.45*Math.cos(col*.48+fold)**2;
   const length=height*(.23+.16*beam)/depth;
   ctx.globalAlpha=beam*(.75+.25*Math.sin(a*3+t*.65))*(1-layer*.18);
   ctx.drawImage(ray,x,base-length,glyphWidth/depth,length);
 }
 ctx.globalAlpha=1;
}
function resize(){
 width=innerWidth;height=innerHeight;
 const scale=Math.min(devicePixelRatio||1,1.6);
 canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);
 ctx?.setTransform(scale,0,0,scale,0,0);cacheScene();draw(time);
}
function animate(now){
 time+=last?Math.min(.05,(now-last)/1000):0;last=now;draw(time);
 frame=requestAnimationFrame(animate);
}
function sync(){
 cancelAnimationFrame(frame);last=0;
 if(!motion.matches&&!document.hidden)frame=requestAnimationFrame(animate);
}
function enter(){
 clearTimeout(startTimer);
 const moveFocus=intro.contains(document.activeElement);
 document.body.classList.add('entered');intro.inert=true;app.inert=false;
 if(moveFocus)replay.focus();
 clearTimeout(endTimer);
 endTimer=setTimeout(()=>{intro.hidden=true},motion.matches?0:1600);
}
function begin(manual=false){
 clearTimeout(endTimer);clearTimeout(startTimer);
 intro.hidden=false;intro.inert=false;app.inert=true;document.body.classList.remove('entered');
 if(manual)skip.focus();
 startTimer=setTimeout(enter,motion.matches?(manual?1500:0):5200);
}
skip.onclick=enter;replay.onclick=()=>begin(true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!intro.inert)enter()});
addEventListener('resize',resize);document.addEventListener('visibilitychange',sync);
motion.addEventListener('change',()=>{sync();if(motion.matches&&!intro.inert)enter()});
resize();sync();begin();
</script>
</html>
