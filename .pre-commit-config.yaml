# SolarRT pre-commit hooks
# See https://pre-commit.com/ for more details
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (lint + format)
        entry: ruff check --fix
        language: system
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        always_run: true
      - id: mypy
        name: MyPy type check
        entry: mypy solarrt/
        language: system
        always_run: true
      - id: pytest
        name: Run pytest on staged files
        entry: pytest -q
        language: system
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: merge-staged-styles