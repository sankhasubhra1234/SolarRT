# SolarRT production stack for a VPS: the app + Caddy (automatic HTTPS).
# Usage (on the server, in this folder):  cp .env.example .env  # then edit .env
#                                         docker compose up -d --build
# Full guide: docs/DEPLOY.md

name: solarrt

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: solarrt:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SOLARRT_DATA_DIR: /data
    volumes:
      - solarrt-data:/data            # feedback.jsonl lives here (back it up)
    expose:
      - "8000"                        # internal only, never published to the internet
    read_only: true                   # container filesystem is read-only...
    tmpfs:
      - /tmp                          # ...except a scratch dir
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                 # HTTP/3
    environment:
      SOLARRT_DOMAIN: ${SOLARRT_DOMAIN:?set SOLARRT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # HTTPS certificates
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  solarrt-data:
  caddy-data:
  caddy-config:
