[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solarrt"
version = "2.0.0"
description = "Real-time regional aurora forecast, Kp index and local aurora chances from NOAA SWPC data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "S. Debnath" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solarrt = "solarrt.__main__:main"

[tool.setuptools.packages.find]
include = ["solarrt*"]

[tool.setuptools.package-data]
solarrt = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
