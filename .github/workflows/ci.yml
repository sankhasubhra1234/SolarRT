name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 0"
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ["3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r deploy/requirements-web.txt pytest ruff mypy bandit pip-audit
      - run: python -m pytest -q
      - run: python -m ruff check solarrt tests
      - run: python -m mypy --ignore-missing-imports solarrt
      - run: python -m bandit -r solarrt
      - run: python -m pip_audit -r deploy/requirements-web.txt
      - run: python -m pip wheel . --no-deps -w dist
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --prefix mobile
      - run: docker build -t solarrt:ci .
      - run: docker run -d --read-only --tmpfs /tmp -p 127.0.0.1:8000:8000 solarrt:ci
      - run: curl --retry 12 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/api/health
