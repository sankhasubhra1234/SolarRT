name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly dependency update check
    - cron: "0 4 * * 0"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: D:\Projects\Python\SolarRT2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          if -not (Test-Path requirements.txt) { python -m pip install -r requirements.in }
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format check
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy solarrt/

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt

      - name: bandit
        run: python -m bandit -r solarrt/

  # Android debug build (optional, requires SDK on the runner)
  # android:
  #   needs: test
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Set up Java
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: 'ms'
  #         java-version: '21'
  #     - name: Set up Android SDK
  #       uses: reactivecircus/android-emulator-runner@v2
  #       with:
  #         api-level: 33
  #     - name: Build debug APK
  #       run: .\mobile\build.ps1 -ApiBase https://solarrt.example.com -Debug

  dependabot:
    needs: test
    runs-on: ubuntu-latest
    if: matrix.python-version == '3.14'
    steps:
      - uses: actions/checkout@v4
      - name: Enable Dependabot
        run: |
          echo "dependabot enabled" >> $GITHUB_ENV

  # Build wheel and smoke-test
  wheel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build deps
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build wheel
        run: python -m pip wheel . -w dist --no-deps
      - name: Install wheel in virtual env
        run: |
          python -m venv .venv_wheel
          source .venv_wheel/bin/activate
          pip install . --force-reinstall
      - name: Smoke test
        run: |
          .venv_wheel/bin/python -m solarrt --port 8000 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/api/health